name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: flow-suppression/flow-suppression
          ref: 244c8e584018a612f5541c44ba499745ea55ab03
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run check
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
